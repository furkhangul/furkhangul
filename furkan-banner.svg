<svg
  width="800"
  height="450"
  viewBox="0 0 800 450"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="signatureGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8f8f8"/>
      <stop offset="100%" stop-color="#eaeaea"/>
    </linearGradient>
  </defs>

  <!-- Arka plandaki GIF -->
  <image
    href="https://i.pinimg.com/originals/d6/6b/ec/d66bec4584554d28c0ef100a641d9ec4.gif"
    x="0"
    y="0"
    width="800"
    height="450"
    preserveAspectRatio="xMidYMid slice"
  />

  <!-- Hafif koyuluk -->
  <rect x="0" y="0" width="800" height="450" fill="black" opacity="0.12"/>

  <!-- Yumuşak arka parıltı -->
  <text
    x="400"
    y="225"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Segoe Script', 'Lucida Handwriting', 'Brush Script MT', cursive"
    font-size="88"
    font-style="italic"
    font-weight="400"
    letter-spacing="1.2"
    fill="rgba(255,255,255,0.35)"
    filter="url(#glow)"
  >
    Furkan Gül
  </text>

  <!-- Ana imza yazısı -->
  <text
    x="400"
    y="220"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Segoe Script', 'Lucida Handwriting', 'Brush Script MT', cursive"
    font-size="88"
    font-style="italic"
    font-weight="400"
    letter-spacing="1.2"
    fill="url(#signatureGradient)"
    filter="url(#softShadow)"
  >
    Furkan Gül
  </text>

  <!-- İmza altı zarif çizgi -->
  <path
    d="M245 265 C305 290, 375 288, 435 270 C495 252, 545 255, 605 282"
    fill="none"
    stroke="rgba(255,255,255,0.92)"
    stroke-width="2.2"
    stroke-linecap="round"
    filter="url(#softShadow)"
  />

  <!-- İmza kuyruğu -->
  <path
    d="M585 281 C620 288, 648 280, 670 258"
    fill="none"
    stroke="rgba(255,255,255,0.92)"
    stroke-width="1.8"
    stroke-linecap="round"
    filter="url(#softShadow)"
  />
</svg>
